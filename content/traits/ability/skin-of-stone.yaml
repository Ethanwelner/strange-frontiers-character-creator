id: skin-of-stone
name: "Skin of Stone"
status: draft
plane: any
summary: "Turns a character's skin to stone for a time."
tags: [magic, spell, earth, enchantment]
category: ability
ranked: true
minStats: { magic: 2 }
prerequisites: [magical-endurance]
# On the Magic list: its own tab on the Traits step, open to every character.
